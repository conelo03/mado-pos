name: CI/CD Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Upload Build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SM_SERVER_HOST }}
          username: ${{ secrets.SM_SERVER_USER }}
          key: ${{ secrets.SM_SERVER_KEY }}
          source: "public/build/*"
          target: "/var/www/mado-pos/public/build"
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SM_SERVER_HOST }}
          username: ${{ secrets.SM_SERVER_USER }}
          key: ${{ secrets.SM_SERVER_KEY }}
          script: |
            cd /var/www/mado-pos
            git fetch origin main || exit 1
            git reset --hard origin/main || exit 1
            composer install --no-dev --prefer-dist --optimize-autoloader || exit 1
            php artisan migrate --force || exit 1
            php artisan optimize:clear || exit 1
            php artisan optimize || exit 1